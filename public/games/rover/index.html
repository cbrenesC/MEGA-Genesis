<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Mission · Rover lunar</title><style>body{margin:0;background:#101927;color:#eaf4ff;font:16px system-ui}header,main{max-width:980px;margin:auto;padding:12px}a{color:#9eeaff}main{display:grid;grid-template-columns:1fr 250px;gap:15px}canvas{width:100%;background:#182231;border:1px solid #536778;image-rendering:pixelated}aside{padding:14px;background:#1d2c3d;border-radius:8px}button[data-dir]{touch-action:none}button{padding:12px;margin:4px;background:#9adbd4;color:#102b30;border:0;border-radius:6px;font-weight:bold}#status{line-height:1.6}@media(max-width:700px){main{grid-template-columns:1fr}}</style><header><a href="/">← Volver al complejo</a><h1>02 · Envío de rover a la Luna</h1><p>Completa el aterrizaje y conduce el rover hasta tres muestras científicas. Evita cráteres y administra la batería.</p></header><main><canvas id="view" width="640" height="520" aria-label="Superficie lunar"></canvas><aside><h2>Control de misión</h2><p id="status" role="status">Selecciona INICIAR MISIÓN.</p><button id="start">INICIAR MISIÓN</button><button id="reset">REINICIAR</button><p>Movimiento: WASD o flechas.</p><div><button data-dir="up">↑</button><br><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><p id="telemetry">Batería 100% · Muestras 0/3</p></aside></main><script>
const c=document.getElementById('view'),ctx=c.getContext('2d'),status=document.getElementById('status'),keys=new Set(),craters=[{x:180,y:150,r:45},{x:390,y:320,r:52},{x:470,y:125,r:38},{x:130,y:400,r:35}],samples=[{x:315,y:130,done:false},{x:530,y:430,done:false},{x:105,y:270,done:false}];let mode='ready',x=320,y=460,battery=100,last=0,landingTimer;function reset(){clearTimeout(landingTimer);keys.clear();mode='ready';x=320;y=460;battery=100;samples.forEach(s=>s.done=false);status.textContent='Selecciona INICIAR MISIÓN.'}document.getElementById('start').onclick=()=>{reset();mode='landing';status.textContent='Aterrizaje automático en progreso...';landingTimer=setTimeout(()=>{if(mode==='landing'){mode='drive';status.textContent='Aterrizaje exitoso. Recoge las tres muestras.'}},1600)};document.getElementById('reset').onclick=reset;window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase())});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-dir]').forEach(b=>{const k='arrow'+b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k)});for(const ev of ['pointerup','pointerleave','pointercancel'])b.addEventListener(ev,()=>keys.delete(k))});
function frame(t){const dt=Math.min((t-last)/1000||0,.05);last=t;if(mode==='drive'){let dx=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),dy=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));if(dx||dy){const m=Math.hypot(dx,dy),nx=Math.max(18,Math.min(622,x+dx/m*90*dt)),ny=Math.max(18,Math.min(502,y+dy/m*90*dt));if(craters.some(q=>Math.hypot(nx-q.x,ny-q.y)<q.r+13)){battery=Math.max(0,battery-8*dt);status.textContent='Obstáculo detectado: evita los cráteres.'}else{x=nx;y=ny;battery=Math.max(0,battery-1.8*dt)}}for(const s of samples){if(!s.done&&Math.hypot(x-s.x,y-s.y)<22){s.done=true;status.textContent='Muestra científica recolectada.'}}if(samples.every(s=>s.done)){mode='won';status.textContent='¡Misión completada! Tres muestras recuperadas.'}else if(battery<=0){mode='failed';status.textContent='Misión fallida: batería agotada.'}}ctx.fillStyle='#26303a';ctx.fillRect(0,0,640,520);ctx.fillStyle='#34404a';for(let i=0;i<120;i++){let px=(i*127)%640,py=(i*89)%520;ctx.fillRect(px,py,3,3)}for(const q of craters){ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fillStyle='#121c27';ctx.fill();ctx.strokeStyle='#61707b';ctx.lineWidth=6;ctx.stroke()}for(const s of samples)if(!s.done){ctx.fillStyle='#6ce2cf';ctx.fillRect(s.x-7,s.y-7,14,14)}ctx.fillStyle='#e9e4d6';ctx.fillRect(x-16,y-11,32,22);ctx.fillStyle='#5c9fb7';ctx.fillRect(x-7,y-8,14,12);ctx.fillStyle='#121923';ctx.fillRect(x-17,y+9,11,9);ctx.fillRect(x+7,y+9,11,9);ctx.fillStyle='#fff';ctx.font='16px monospace';ctx.fillText('LUNAR SURFACE // ROVER',16,28);ctx.fillText('MISSION '+mode.toUpperCase(),16,50);document.getElementById('telemetry').textContent='Batería '+battery.toFixed(0)+'% · Muestras '+samples.filter(s=>s.done).length+'/3';requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
