<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Mission · Lanzamiento</title><style>body{margin:0;background:#0a1524;color:#eaf4ff;font:16px system-ui}header,section{padding:14px;max-width:1000px;margin:auto}a{color:#9eeaff}main{max-width:1000px;margin:auto;display:grid;grid-template-columns:1fr 280px;gap:16px;padding:12px}canvas{width:100%;background:#081321;border:1px solid #4c7089;image-rendering:pixelated}aside{background:#14273b;padding:16px;border-radius:10px}label{display:block;margin:14px 0}input{width:100%}button{padding:12px;border:0;border-radius:6px;background:#73ddcf;color:#092029;font-weight:bold;cursor:pointer}button:disabled{opacity:.4}#log{min-height:90px;line-height:1.5}@media(max-width:700px){main{grid-template-columns:1fr}}</style><header><a href="./">← Volver al módulo de lanzamiento</a><h1>01 · Lanzamiento espacial</h1><p>Configura combustible, empuje y ángulo. Supera el ascenso sin agotar el combustible ni exceder los límites de seguridad.</p></header><main><canvas id="view" width="640" height="560" aria-label="Simulación de lanzamiento"></canvas><aside><label>Combustible inicial <output id="fuelValue">85</output>%<input id="fuel" type="range" min="50" max="100" value="85"></label><label>Empuje <output id="thrustValue">85</output>%<input id="thrust" type="range" min="60" max="100" value="85"></label><label>Ángulo <output id="angleValue">0</output>°<input id="angle" type="range" min="-15" max="15" value="0"></label><button id="start">INICIAR LANZAMIENTO</button><p id="telemetry">ALT 0 km · VEL 0 m/s</p><p id="log" role="status">Objetivo: alcanzar 100 km de altitud.</p><button id="reset">REINICIAR</button></aside></main><script>
const c=document.getElementById('view'),ctx=c.getContext('2d'),els=Object.fromEntries(['fuel','thrust','angle'].map(k=>[k,document.getElementById(k)]));let state='ready',alt=0,vel=0,fuel=85,x=320,clock=0,last=0,stars=Array.from({length:65},(_,i)=>({x:(i*97)%640,y:(i*179)%500}));for(const k of Object.keys(els))els[k].oninput=()=>document.getElementById(k+'Value').textContent=els[k].value;
function message(s){document.getElementById('log').textContent=s}
document.getElementById('start').onclick=()=>{state='flight';alt=0;vel=0;x=320;clock=0;fuel=+els.fuel.value;for(const e of Object.values(els))e.disabled=true;document.getElementById('start').disabled=true;message('Despegue autorizado. Monitoreando trayectoria...')};
document.getElementById('reset').onclick=()=>{state='ready';alt=vel=clock=0;x=320;fuel=+els.fuel.value;for(const e of Object.values(els))e.disabled=false;document.getElementById('start').disabled=false;message('Sistema listo. Ajusta los parámetros.')};
function frame(t){let dt=Math.min((t-last)/1000||0,.05);last=t;if(state==='flight'){clock+=dt;let power=+els.thrust.value/100,angle=+els.angle.value*Math.PI/180;fuel=Math.max(0,fuel-dt*(.65+power*.65));let accel=(power*24*(fuel>0?1:0)*Math.cos(angle)-9.81);vel=Math.max(-80,vel+accel*dt);alt=Math.max(0,alt+vel*dt*.12);x+=Math.sin(angle)*vel*dt*.08;if(Math.abs(x-320)>210){state='failed';message('Misión fallida: desviación excesiva de la trayectoria.')}else if(alt>=100){state='won';message('¡Misión completada! Alcanzaste la línea de Kármán (100 km).')}else if(alt===0&&clock>4&&vel<=0||fuel===0&&vel<=0){state='failed';message('Misión fallida: empuje o combustible insuficiente.')}}ctx.fillStyle=alt>45?'#06101e':'#153753';ctx.fillRect(0,0,640,560);ctx.fillStyle='#eaf7ff';for(const s of stars){ctx.fillRect(s.x,s.y,2,2)}let ground=Math.max(540,540+alt*4);ctx.fillStyle='#647681';ctx.fillRect(0,ground,640,30);let rocketY=Math.max(90,470-alt*3.4);ctx.save();ctx.translate(x,rocketY);ctx.rotate(+els.angle.value*Math.PI/180);ctx.fillStyle='#edf2f5';ctx.fillRect(-12,-46,24,76);ctx.fillStyle='#e66b4c';ctx.beginPath();ctx.moveTo(-12,-46);ctx.lineTo(0,-70);ctx.lineTo(12,-46);ctx.fill();ctx.fillRect(-25,12,13,22);ctx.fillRect(12,12,13,22);ctx.fillStyle='#62c7e6';ctx.fillRect(-7,-27,14,14);if(state==='flight'&&fuel>0){ctx.fillStyle='#ffc66b';ctx.fillRect(-8,30,16,20+Math.random()*24)}ctx.restore();ctx.fillStyle='#e8f6ff';ctx.font='17px monospace';ctx.fillText('SPACE MISSION // LAUNCH',18,30);ctx.fillText('ALT '+alt.toFixed(1)+' km',18,58);ctx.fillText('FUEL '+fuel.toFixed(1)+'%',18,83);document.getElementById('telemetry').textContent='ALT '+alt.toFixed(1)+' km · VEL '+vel.toFixed(1)+' m/s · FUEL '+fuel.toFixed(0)+'%';requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
