<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Space Mission · Lanzamiento</title>
  <link rel="stylesheet" href="css/launch.css">
</head>
<body>
  <header class="top">
    <a href="/">← Volver al complejo</a>
    <h1>01 · Lanzamiento espacial <span id="difficulty-badge" class="tag"></span></h1>
    <p>El lanzador no es un trámite: decide cuánta masa puedes llevar, a qué órbita llegas, cuánto gastas y cuánto arriesgas. Elige, verifica, compara y lanza.</p>
  </header>

  <div class="layout" id="app">
    <main>
      <div id="guide" class="guide" hidden></div>
      <details id="mock-panel" class="card mock" hidden></details>
      <section id="step-mission" class="card"></section>
      <section id="step-catalog" class="card"></section>
      <section id="step-check" class="card"></section>
      <section id="step-compare" class="card"></section>
      <section id="step-launch" class="card"></section>
      <section id="step-result" class="card" hidden></section>
    </main>
    <aside>
      <section id="res-panel" class="card"></section>
      <section id="team-panel" class="card"></section>
    </aside>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
