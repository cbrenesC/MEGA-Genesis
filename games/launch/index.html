<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111d">
  <title data-i18n="sim.flight.page-title">Space Mission · Lanzamiento</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell" id="shell">
    <div id="game" aria-hidden="true"></div>

    <header class="topbar" id="topbar">
      <a class="back" href="/" data-mission-exit data-locale-link title="Volver a Mission Control" data-i18n-title="sim.flight.back-control">← <span data-i18n="sim.flight.control-short">Complejo</span></a>
      <div class="brand"><span class="kicker" data-i18n="sim.flight.module">MÓDULO 01</span><b id="mission-brand" data-i18n="sim.flight.launch">Lanzamiento</b></div>
      <nav class="steps" id="steps" aria-label="Pasos del juego" data-i18n-aria="sim.flight.steps"></nav>
      <div id="res-pills" class="res-pills" aria-label="Recursos de la misión" data-i18n-aria="sim.flight.resources"></div>
      <span class="badge approx" title="Todas las cifras están redondeadas o simplificadas para el juego." data-i18n-title="sim.flight.approx-description" data-i18n="sim.flight.approx">≈ datos aproximados para el juego</span>
    </header>

    <main class="ui" id="ui" hidden></main>
    <aside class="resources" id="resources" aria-label="Recursos de la misión" data-i18n-aria="sim.flight.resources" hidden></aside>
    <section class="hud" id="hud" hidden></section>
    <div class="overlay" id="overlay" hidden></div>

    <div class="boot" id="boot">
      <div class="boot-card">
        <span class="kicker" data-i18n="sim.flight.module-boot">SPACE MISSION · MÓDULO DE LANZAMIENTO</span>
        <h1 data-i18n="sim.flight.preparing-pad">Preparando la plataforma…</h1>
        <div class="boot-bar"><i></i></div>
        <div class="fact" id="boot-fact"></div>
        <p class="muted" id="boot-error" role="alert" hidden></p>
        <button type="button" id="boot-back" data-mission-exit data-i18n="common.backControl" hidden>Volver al centro de control</button>
      </div>
    </div>

    <div class="popover" id="popover" role="dialog" aria-modal="false" hidden>
      <button class="popover-close" aria-label="Cerrar" data-i18n-aria="sim.flight.close">×</button>
      <strong id="popover-title"></strong>
      <p id="popover-text"></p>
      <details id="popover-more"></details>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
