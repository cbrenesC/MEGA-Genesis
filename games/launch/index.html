<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111d">
  <title>Space Mission · Lanzamiento</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell" id="shell">
    <div id="game" aria-hidden="true"></div>

    <header class="topbar" id="topbar">
      <a class="back" href="/" data-locale-link title="Volver a Mission Control">← <span>Complejo</span></a>
      <div class="brand"><span class="kicker">MÓDULO 01</span><b>Lanzamiento</b></div>
      <nav class="steps" id="steps" aria-label="Pasos del juego"></nav>
      <div id="res-pills" class="res-pills" aria-label="Recursos de la misión"></div>
      <a class="back" href="./practica-ascenso.html" data-locale-link>Práctica</a>
      <span class="badge approx" title="Todas las cifras están redondeadas o simplificadas para el juego.">≈ datos aproximados para el juego</span>
    </header>

    <main class="ui" id="ui" hidden></main>
    <aside class="resources" id="resources" aria-label="Recursos de la misión" hidden></aside>
    <section class="hud" id="hud" hidden></section>
    <div class="overlay" id="overlay" hidden></div>

    <div class="boot" id="boot">
      <div class="boot-card">
        <span class="kicker">SPACE MISSION · MÓDULO DE LANZAMIENTO</span>
        <h1>Preparando la plataforma…</h1>
        <div class="boot-bar"><i></i></div>
        <div class="fact" id="boot-fact"></div>
        <p class="muted" id="boot-error" hidden></p>
      </div>
    </div>

    <div class="popover" id="popover" role="dialog" aria-modal="false" hidden>
      <button class="popover-close" aria-label="Cerrar">×</button>
      <strong id="popover-title"></strong>
      <p id="popover-text"></p>
      <details id="popover-more"></details>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
