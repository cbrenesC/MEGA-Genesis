<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111d">
  <title data-i18n="sim.rover.page-title">Space Mission · Rover lunar</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-screen="waiting">
  <div class="shell">
    <div id="game" aria-hidden="true"></div>

    <header class="topbar">
      <a class="back" href="/" data-mission-exit data-locale-link title="Volver al complejo" data-i18n-title="sim.rover.back-control">← <span data-i18n="sim.rover.control-short">Complejo</span></a>
      <div class="brand"><span class="kicker" data-i18n="sim.rover.module">MÓDULO 02</span><b data-i18n="sim.rover.lunar-rover">Rover lunar</b></div>
      <nav class="steps" id="steps" aria-label="Pasos de la misión" data-i18n-aria="sim.rover.steps"></nav>
    </header>

    <main class="screen" id="screen-waiting" data-screen-id="waiting" role="status"></main>
    <main class="screen" id="screen-results" data-screen-id="results" hidden></main>

    <section class="hud" id="hud" data-screen-id="explore" hidden aria-label="Telemetría de la misión" data-i18n-aria="sim.rover.telemetry">
      <div class="hud-top" id="hud-top">
        <div class="hud-stats" id="hud-stats"></div>
        <button type="button" id="btn-pause" class="ghost" aria-label="Pausar misión" data-i18n-aria="sim.rover.pause-mission">⏸ <span data-i18n="sim.rover.pause">Pausa</span></button>
        <div class="hud-data" id="hud-data" hidden aria-label="Centro de datos" data-i18n-aria="sim.rover.data-center" role="group"></div>
      </div>
      <div class="hud-bottom" id="hud-bottom">
        <p class="hint" id="hud-hint" role="status" aria-live="polite"></p>
        <div class="controls">
          <div class="dpad" id="dpad" aria-label="Movimiento" data-i18n-aria="sim.rover.movement">
            <button type="button" data-dir="up" aria-label="Arriba" data-i18n-aria="sim.rover.up">▲</button>
            <button type="button" data-dir="left" aria-label="Izquierda" data-i18n-aria="sim.rover.left">◀</button>
            <button type="button" data-dir="down" aria-label="Abajo" data-i18n-aria="sim.rover.down">▼</button>
            <button type="button" data-dir="right" aria-label="Derecha" data-i18n-aria="sim.rover.right">▶</button>
          </div>
          <div class="actions" id="actions">
            <button type="button" data-action="collect"><b>E</b> <span data-i18n="sim.rover.action-collect">Recoger</span></button>
            <button type="button" data-action="analyze"><b>F</b> <span data-i18n="sim.rover.action-analyze">Analizar</span></button>
            <button type="button" data-action="transmit"><b>T</b> <span data-i18n="sim.rover.action-transmit">Transmitir</span></button>
            <button type="button" data-action="photo"><b>C</b> <span data-i18n="sim.rover.action-photo">Fotografiar</span></button>
            <button type="button" data-action="scan"><b>R</b> <span data-i18n="sim.rover.action-scan">Escanear</span></button>
          </div>
        </div>
      </div>
    </section>

    <div class="overlay" id="pause" hidden>
      <div class="panel dialog" role="dialog" aria-modal="true" aria-labelledby="pause-title">
        <h2 id="pause-title" class="pixel" data-i18n="sim.rover.mission-paused">Misión en pausa</h2>
        <p class="muted" data-i18n="sim.rover.paused-detail">La simulación, el reloj y las acciones en curso están detenidos.</p>
        <div class="stack">
          <button type="button" class="primary" data-cmd="resume" data-i18n="sim.rover.resume">Continuar</button>
          <button type="button" data-cmd="restart" data-i18n="sim.rover.restart">Reiniciar misión</button>
          <button type="button" data-cmd="exit" data-i18n="sim.rover.back-control">Volver al centro de control</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
